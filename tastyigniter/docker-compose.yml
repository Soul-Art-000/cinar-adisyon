version: '3'
services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./html:/var/www/html
    depends_on:
      - db
  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=tastyigniter
      - MYSQL_USER=tasty
      - MYSQL_PASSWORD=tasty
